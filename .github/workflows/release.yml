name: Release

# 打 tag（如 v1.0.0）即触发：构建签名 release APK 并发布到 GitHub Releases
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要写权限

# Opt the still-Node-20 actions (setup-android, action-gh-release) onto Node 24
# now, ahead of the 2026-06-16 forced migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 有 KEYSTORE_BASE64 才解码并启用签名；没有则跳过，构建回退到 debug 签名（不再硬失败）
      - name: Decode keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signing: using provided release keystore"
          else
            echo "signing: KEYSTORE_BASE64 not set — falling back to debug signing"
          fi

      # KEYSTORE_FILE 仅在上一步设置了才存在于环境中；未设置时 build.gradle 走 debug 签名
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          cp app/build/outputs/apk/release/app-release.apk "SMSForwarder-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SMSForwarder-${{ github.ref_name }}.apk
          generate_release_notes: true
